server {
    listen 80;
    server_name localhost;

    # Configuration pour servir des tiles OpenStreetMap
    location /tile/ {
        # Headers CORS pour permettre les requêtes depuis le frontend
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        
        # Proxy vers le service de tiles OpenStreetMap public
        proxy_pass https://tile.openstreetmap.org/;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Cache des tiles pour améliorer les performances
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Page d'accueil simple
    location / {
        return 200 '{"status":"Tile Server Running","endpoint":"/tile/{z}/{x}/{y}.png"}';
        add_header Content-Type application/json;
    }
}