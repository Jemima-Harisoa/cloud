server:
  port: 8080

spring:
  application:
    name: identity-provider-backend
  
  profiles:
    active: ${ACTIVE_PROFILE:local}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuration CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:4200,http://localhost:8100,http://localhost,capacitor://localhost}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

# Configuration H2 en mémoire (par défaut)
---
spring:
  config:
    activate:
      on-profile: h2
  
  datasource:
    url: jdbc:h2:mem:identityprovider;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console

# Configuration PostgreSQL local
---
spring:
  config:
    activate:
      on-profile: local
  
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_provider
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  database:
    type: postgres
  
  security:
    jwt:
      secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation123456789}
      expiration: 86400000 # 24 heures en millisecondes
  
  auth:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:3}
    session-duration: ${SESSION_DURATION:86400} # 24 heures en secondes

# Configuration Firebase (online)
---
spring:
  config:
    activate:
      on-profile: firebase

app:
  database:
    type: firebase
  
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-credentials.json}
    database-url: ${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}
  
  security:
    jwt:
      secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation123456789}
      expiration: 86400000
  
  auth:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:3}
    session-duration: ${SESSION_DURATION:86400}

# Configuration Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
