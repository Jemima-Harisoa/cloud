services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: identity-provider-postgres
    environment:
      POSTGRES_DB: cloud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      # Volume nommé pour éviter la corruption
      - postgres_data:/var/lib/postgresql/data
      # Charger automatiquement les scripts SQL au démarrage
      - ./sql:/docker-entrypoint-initdb.d
      - ./scripts:/scripts
      # Dossier pour les backups manuels
      - ./data/backups:/backups
    networks:
      - identity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Tile Server simple avec Nginx
  tile-server:
    image: nginx:alpine
    container_name: identity-provider-tile-server
    ports:
      - "8081:80"
    volumes:
      # config nginx (proxy vers OSM en ligne)
      - ./nginx-tiles.conf:/etc/nginx/conf.d/default.conf
      # style JSON local
      - ./tile-server/styles:/styles
    networks:
      - identity-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Volume nommé pour PostgreSQL (évite la corruption)
  postgres_data:
    driver: local

networks:
  identity-network:
    driver: bridge
